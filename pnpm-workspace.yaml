minimumReleaseAgeExclude:
  - dompurify@3.4.15
  # Both were published within the release-age cooldown, so a fresh resolution
  # rolls the lockfile back to lucide-react@1.43.0 / fallow@3.23.0 rather than
  # failing — a silent downgrade nobody reviews. The fallow entries have no
  # version because its platform binaries ship in lockstep with the CLI.
  - lucide-react@1.44.0
  - fallow@3.24.1
  - fallow-type-aware
  - "@fallow-cli/*"

overrides:
  "@monaco-editor/loader": ^1.7.0
  js-yaml@<3.15.0: 3.15.0
  mdast-util-to-hast@<13.2.1: 13.2.1
  "@babel/core@<=7.29.0": 7.29.7
  dompurify@<=3.4.11: 3.4.14
  browserslist@<=4.28.6: 4.28.9

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  core-js: true
  dotenv: true
  esbuild: true
  fallow: true
  prisma: true
  sharp: true
  unrs-resolver: true
