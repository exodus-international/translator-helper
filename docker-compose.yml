services:
  postgres:
    image: postgres:16-alpine
    container_name: translation-helper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: translation_helper
    ports:
      - '5511:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible storage for avatars and generated audio. Production uses a
  # real bucket; this is the same API on a local port so uploads can be
  # exercised without credentials to anything.
  minio:
    image: minio/minio:latest
    container_name: translation-helper-storage
    restart: unless-stopped
    command: server /data --console-address ':9012'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9011:9000' # S3 API
      - '9012:9012' # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the bucket and makes its objects publicly readable, which is what
  # the app assumes: stored URLs are handed straight to the browser.
  minio-init:
    image: minio/mc:latest
    container_name: translation-helper-storage-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/translation-helper &&
      mc anonymous set download local/translation-helper
      "

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
