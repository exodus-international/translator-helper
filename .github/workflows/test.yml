name: Test

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @prisma/client ships no types until its schema is generated. The
      # postinstall that normally does this does not re-run when pnpm restores
      # a cached store, so generate explicitly. Needs no DATABASE_URL.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test
